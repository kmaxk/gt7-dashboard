# Builds the installers for a published GitHub release and attaches them.
# jpackage cannot cross-compile, so each format is built on its own OS.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. v1.0.1
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            task: packageDmg
            format: dmg
          - os: windows-latest
            task: packageMsi
            format: msi
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # build code must not find the write token in .git/config; uploads use GH_TOKEN
          persist-credentials: false

      # JDK 17 with jpackage; the Compose plugin downloads WiX for the MSI itself
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test
        shell: bash
        run: ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" :shared:desktopTest

      - name: Package
        shell: bash
        run: ./gradlew "-Dorg.gradle.java.home=$JAVA_HOME" :desktopApp:${{ matrix.task }}

      - name: Show signature
        if: matrix.format == 'dmg'
        run: codesign -dv "desktopApp/build/compose/binaries/main/app/GT7 Dashboard.app"

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in desktopApp/build/compose/binaries/main/${{ matrix.format }}/*; do
            # named after the tag: the macOS bundle version may differ from the release version
            out="GT7-Dashboard-${TAG#v}.${f##*.}" # v0.0.1 + .msi -> GT7-Dashboard-0.0.1.msi
            cp "$f" "$out"
            gh release upload "$TAG" "$out" --clobber
          done

  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # build code must not find the write token in .git/config; uploads use GH_TOKEN
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test
        run: ./gradlew :shared:desktopTest :shared:testAndroidHostTest

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew :androidApp:assembleRelease -PversionName="${TAG#v}" -PversionCode=${{ github.run_number }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="GT7-Dashboard-${TAG#v}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$out"
          gh release upload "$TAG" "$out" --clobber
