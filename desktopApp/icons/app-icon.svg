<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GT7 Dashboard app icon: track ribbon with racing car and ghost, motorsport blue -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A5CF0"/>
      <stop offset="0.5" stop-color="#0D2E95"/>
      <stop offset="1" stop-color="#050F38"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FE3FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000820" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <path id="track" d="M 40 820 C 280 820, 400 640, 520 500 S 790 230, 1000 210"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
    <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.14">
      <line x1="170" y1="330" x2="560" y2="150" stroke-width="20"/>
      <line x1="230" y1="410" x2="720" y2="182" stroke-width="10"/>
    </g>
    <!-- track: white edges, asphalt, kerb on the inside of the bend -->
    <g filter="url(#shadow)">
      <use href="#track" fill="none" stroke="#FFFFFF" stroke-width="150"/>
    </g>
    <use href="#track" fill="none" stroke="#1B2133" stroke-width="128"/>
    <use href="#track" fill="none" stroke="#FFFFFF" stroke-width="128" stroke-dasharray="0 1"/>
    <path d="M 330 735 C 420 660, 470 580, 520 520" fill="none" stroke="#FFFFFF" stroke-width="26" transform="translate(52 52)"/>
    <path d="M 330 735 C 420 660, 470 580, 520 520" fill="none" stroke="#E10600" stroke-width="26" stroke-dasharray="26 26" transform="translate(52 52)"/>
    <use href="#track" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="34 30"/>
    <!-- ghost ahead, car behind -->
    <circle cx="676" cy="330" r="96" fill="url(#glow)"/>
    <circle cx="676" cy="330" r="36" fill="#7FE3FF"/>
    <g filter="url(#shadow)"><circle cx="452" cy="572" r="42" fill="#FFFFFF"/></g>
    <circle cx="452" cy="572" r="18" fill="#E10600"/>
    <!-- 7 with speed slashes -->
    <g fill="#FFFFFF" filter="url(#shadow)">
      <path d="M 640 660 L 870 660 L 860 720 L 760 880 L 680 880 L 776 724 L 630 724 Z"/>
      <path d="M 560 760 L 640 760 L 628 784 L 548 784 Z" opacity="0.7"/>
      <path d="M 520 812 L 610 812 L 598 836 L 508 836 Z" opacity="0.45"/>
    </g>
  </g>
</svg>
